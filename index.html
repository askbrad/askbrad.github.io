<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Engineer — Rogue-Lite Prototype</title>
    <style>
      :root {
        --hud-bg: rgba(10, 14, 20, 0.72);
        --hud-border: rgba(120, 190, 230, 0.35);
        --hud-text: #cfe6f5;
        --hud-accent: #ffc63a;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0e14;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: var(--hud-text);
        user-select: none;
      }
      .hud-corner {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hud-tl { top: 16px; left: 16px; }
      .hud-tr { top: 16px; right: 16px; align-items: flex-end; }
      .hud-bl { bottom: 14px; left: 16px; }
      .hud-label {
        font-size: 11px;
        letter-spacing: 0.18em;
        opacity: 0.75;
      }
      .energy-bar {
        width: 220px;
        height: 10px;
        background: var(--hud-bg);
        border: 1px solid var(--hud-border);
        border-radius: 3px;
        overflow: hidden;
      }
      .energy-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #2fa8d8, #7fd8f5);
        transition: width 120ms linear;
      }
      .hud-chip,
      .hud-stamp,
      .hud-hint {
        background: var(--hud-bg);
        border: 1px solid var(--hud-border);
        border-radius: 3px;
        padding: 4px 10px;
        font-size: 12px;
        letter-spacing: 0.08em;
        width: fit-content;
      }
      .hud-stamp { color: var(--hud-accent); border-color: rgba(255, 198, 58, 0.35); }
      .hud-hint { opacity: 0.8; font-size: 11px; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
